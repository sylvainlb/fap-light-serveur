# fap-core-contracts v1.0 — stable seams of the FAP core consumed by FAP-LDP
# (spec fap-ldp v0.3 §1.4). Published by the core side: fap-light-serveur/contracts/.
# Any evolution of these contracts goes to v1.1+ (backward compatible) or v2.0 (breaking).
apiVersion: fap.facis/contracts/v1
kind: CoreContracts
metadata:
  name: fap-core-contracts
  version: "1.0"
spec:
  contracts:
    - id: message-envelope
      version: "1.0"
      summary: "Unified message envelope (type, source, timestamp, payload fields) — gate routing on the type field"
    - id: bronze-line-contract
      version: "1.0"
      summary: "Bronze line contract: raw_payload JSONB + lineage (source_topic, source_system, ingest_timestamp, message_key, source_seq)"
    - id: named-schema-transforms
      version: "1.0"
      summary: "SQL transforms on named bronze/silver/gold schemas (+ app as an extension) — same names, same SQL, PG (light) or Trino (full)"
    - id: dsp-exposure-protocols
      version: "1.0"
      summary: "DSP/LDP exposure protocols + catalog auto-derived from information_schema + VC/agreements"
    - id: trino-read-api
      version: "1.0"
      summary: "Gold read via Trino in the full profile — same endpoint/auth/format as the core data plane (SELECT … WHERE pk = … LIMIT 1)"
    - id: dsp-control-plane-api
      version: "1.0"
      summary: "Contract lookup → TTL capability → policy + audit (agreement_id). FAP-LDP consumes it without reimplementing (synthesis §4.1)"
  notes:
    - "The FAP core (fap-light-serveur) does not depend on FAP-LDP; these contracts are one-way core → extension."
    - "The DSP v1 data plane remains HMAC + agreement_id (core decision D-3); the VC in the Authorization header is read by the control plane."
