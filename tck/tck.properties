# ============================================================================
# FAP-light server TCK — configuration of the system under test
# (spec fap-light-spec-serveur.md §10, criteria CA-S1..CA-S8)
#
# Any key can be overridden by an environment variable prefixed with
# TCK_ and dotted with underscores:  dsp.base.url -> TCK_DSP_BASE_URL
#
# Copy this file to tck.properties.local and adapt the CHANGE_ME values.
# ============================================================================

# --- PostgreSQL access ------------------------------------------------------
# Base psql command. On the host VM: "psql" (postgresql-client installed).
# From a CI machine with docker: "docker compose -f /srv/fap-light/docker-compose.yml exec -T postgres psql"
pg.cmd=psql
pg.host=localhost
pg.port=5432
pg.db=fap
# Passwords of the 4 roles provisioned from the start (spec §C1.4)
pg.admin.user=admin
pg.admin.password=CHANGE_ME
pg.gate.user=gate
pg.gate.password=CHANGE_ME
pg.reader.user=reader
pg.reader.password=CHANGE_ME
pg.app.user=app
pg.app.password=CHANGE_ME

# --- ORCE (Node-RED): HTTP endpoints -----------------------------------------
dsp.base.url=http://localhost:1880
# Simulation ingestion (envelope / feed payload) -> gate -> bronze
dsp.ingest.sim.path=/ingest/sim
# DSP catalog (POST, CatalogRequest body) and DSP data plane (POST, HMAC-signed request)
dsp.catalogue.path=/dsp/catalogue/request
dsp.dataplane.path=/dsp/data
# Test contract: shared HMAC secret + agreement_id (DSP control plane)
dsp.hmac.secret=CHANGE_ME
dsp.agreement.id=agreement:tck:ca-s4

# --- SFTP (CA-S2) -------------------------------------------------------------
sftp.host=localhost
sftp.port=22
sftp.user=CHANGE_ME
sftp.key=CHANGE_ME
sftp.ingest.dir=/ingest
sftp.archive.dir=/archive
sftp.cycle.s=60            # SFTP flow polling cycle (spec §C1.3)

# --- Medallion schemas / tables (ISO FACIS names, spec §C1.2) ----------------
bronze.table.meter=bronze.energy_meter        # bronze table of the sim.smart_energy.meter feed
bronze.lineage.columns=source_topic,ingest_timestamp,source_system
silver.view.meter=silver.energy_meter         # typed view (->> + CAST, same quality filters)
silver.marker.column=meter_id
silver.time.column=event_timestamp
gold.table.hourly=gold.net_grid_hourly        # gold matview fed by the meter feed
gold.marker.column=site_id

# --- Cross-cutting tables -----------------------------------------------------
dlq.table=dlq                                 # table-based DLQ, raw payload (spec §5)
cursors.table=_cursors                        # cursors (processed SFTP files, offsets)
watermarks.table=silver._watermarks          # silver watermark (spec §C1.5)
watermarks.key=silver.energy_meter
audit.table=dsp_access_audit                  # data space access audit (agreement_id, ts)

# --- Materializers (CA-S6) ----------------------------------------------------
# mode pg_cron: the refresh is handled by pg_cron in Postgres, the TCK polls the watermark.
# mode cli    : the TCK runs the command below (useful in CI without waiting 10 min).
silver.refresh.mode=pg_cron
silver.materializer.cmd=python3 /srv/fap-light/materializers/silver_materializer.py
silver.timeout.s=600                          # silver freshness: <= 10 min (spec §7)
gold.timeout.s=1200                           # gold full refresh ~10-20 min (spec §7)

# --- Rate limit / audit (CA-S5) -----------------------------------------------
rate.limit.per.min=10                         # spec §7: 10 req/min per offer
rate.window.s=60
ca.s5.asset.id=dataset:facis:streetlight-zone-hourly   # dedicated asset for the rate limit test

# --- Data plane (CA-S4) --------------------------------------------------------
ca.s4.asset.id=dataset:facis:net-grid-hourly
data.limit=5000                               # LIMIT 5000 (spec §7)

# --- Superset (CA-S8) — optional API part --------------------------------------
# Leave empty: verification is done at the SQL level (reader role, exact dashboard
# queries). Fill in for a live check via the Superset API.
superset.base.url=
superset.api.token=
superset.chart.ids=
