# ============================================================================
# TCK serveur FAP-light — configuration de la cible sous test
# (spec fap-light-spec-serveur.md §10, critères CA-S1..CA-S8)
#
# Toute clé peut être surchargée par une variable d'environnement préfixée
# TCK_ et ponctuée par des underscores :  dsp.base.url -> TCK_DSP_BASE_URL
#
# Copier ce fichier en tck.properties.local et adapter les CHANGE_ME.
# ============================================================================

# --- Accès PostgreSQL -------------------------------------------------------
# Commande psql de base. Sur la VM hôte : "psql" (postgresql-client installé).
# Depuis un poste CI avec docker : "docker compose -f /srv/fap-light/docker-compose.yml exec -T postgres psql"
pg.cmd=psql
pg.host=localhost
pg.port=5432
pg.db=fap
# Mots de passe des 4 rôles provisionnés dès le départ (spec §C1.4)
pg.admin.user=admin
pg.admin.password=CHANGE_ME
pg.gate.user=gate
pg.gate.password=CHANGE_ME
pg.reader.user=reader
pg.reader.password=CHANGE_ME
pg.app.user=app
pg.app.password=CHANGE_ME

# --- ORCE (Node-RED) : endpoints HTTP ---------------------------------------
dsp.base.url=http://localhost:1880
# Ingestion simulation (enveloppe / payload feed) -> gate -> bronze
dsp.ingest.sim.path=/ingest/sim
# Catalogue DSP (POST, corps CatalogRequest) et data plane DSP (POST, requête signée HMAC)
dsp.catalogue.path=/dsp/catalogue/request
dsp.dataplane.path=/dsp/data
# Contrat de test : secret HMAC partagé + agreement_id (plan de contrôle DSP)
dsp.hmac.secret=CHANGE_ME
dsp.agreement.id=agreement:tck:ca-s4

# --- SFTP (CA-S2) ------------------------------------------------------------
sftp.host=localhost
sftp.port=22
sftp.user=CHANGE_ME
sftp.key=CHANGE_ME
sftp.ingest.dir=/ingest
sftp.archive.dir=/archive
sftp.cycle.s=60            # cycle de polling du flow SFTP (spec §C1.3)

# --- Schémas / tables du médaillon (noms ISO FACIS, spec §C1.2) -------------
bronze.table.meter=bronze.energy_meter        # table bronze du feed sim.smart_energy.meter
bronze.lineage.columns=source_topic,ingest_timestamp,source_system
silver.view.meter=silver.energy_meter         # vue typée (->> + CAST, mêmes filtres qualité)
silver.marker.column=meter_id
silver.time.column=event_timestamp
gold.table.hourly=gold.net_grid_hourly        # matview gold alimentée par le feed meter
gold.marker.column=site_id

# --- Tables transverses ------------------------------------------------------
dlq.table=dlq                                 # DLQ en table, payload brut (spec §5)
cursors.table=_cursors                        # curseurs (fichiers SFTP traités, offsets)
watermarks.table=silver._watermarks          # watermark silver (spec §C1.5)
watermarks.key=silver.energy_meter
audit.table=dsp_access_audit                  # audit des accès data space (agreement_id, ts)

# --- Materializers (CA-S6) ---------------------------------------------------
# mode pg_cron : le refresh est assuré par pg_cron dans Postgres, le TCK poll le watermark.
# mode cli     : le TCK exécute la commande ci-dessous (utile en CI sans attendre 10 min).
silver.refresh.mode=pg_cron
silver.materializer.cmd=python3 /srv/fap-light/materializers/silver_materializer.py
silver.timeout.s=600                          # fraîcheur silver : <= 10 min (spec §7)
gold.timeout.s=1200                           # gold full refresh ~10-20 min (spec §7)

# --- Rate limit / audit (CA-S5) ----------------------------------------------
rate.limit.per.min=10                         # spec §7 : 10 req/min par offre
rate.window.s=60
ca.s5.asset.id=dataset:facis:streetlight-zone-hourly   # asset dédié au test de rate limit

# --- Data plane (CA-S4) -------------------------------------------------------
ca.s4.asset.id=dataset:facis:net-grid-hourly
data.limit=5000                               # LIMIT 5000 (spec §7)

# --- Superset (CA-S8) — partie API optionnelle --------------------------------
# Laisser vide : la vérification se fait au niveau SQL (rôle reader, requêtes exactes
# des dashboards). Renseigner pour un contrôle live via l'API Superset.
superset.base.url=
superset.api.token=
superset.chart.ids=
